<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafafa"/><stop offset="1" stop-color="#e1dfdb"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9b7b2"/><stop offset="1" stop-color="#9c9a95"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/><stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.30"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="64" cy="108" rx="50" ry="8" fill="url(#shadow)"/>
  <!-- корпус: нижняя «толщина» и верхняя грань -->
  <rect x="12" y="44" width="104" height="60" rx="13" fill="url(#side)"/>
  <rect x="12" y="38" width="104" height="60" rx="13" fill="url(#top)"/>
  <rect x="12.5" y="38.5" width="103" height="59" rx="12.5" fill="none" stroke="#fff" stroke-opacity="0.7"/>
  <!-- слот и светодиод -->
  <rect x="26" y="52" width="58" height="9" rx="4.5" fill="#77767b" fill-opacity="0.35"/>
  <circle cx="31" cy="82" r="4.6" fill="#3584e4"/>
  <circle cx="31" cy="82" r="8" fill="#3584e4" fill-opacity="0.18"/>
  <g fill="#77767b" fill-opacity="0.45">
    <rect x="74" y="77" width="26" height="3.4" rx="1.7"/>
    <rect x="74" y="84" width="26" height="3.4" rx="1.7"/>
  </g>
  <!-- акцентный значок «+» -->
  <circle cx="100" cy="36" r="23" fill="#000" fill-opacity="0.10" transform="translate(0 2)"/>
  <circle cx="100" cy="36" r="22" fill="url(#blue)"/>
  <path d="M100 25v22M89 36h22" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/>
